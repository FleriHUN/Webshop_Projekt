<div class="container-fluid" style="min-height: 100vh">
  <div class="row">
    <div class="col-lg-12">
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12 d-flex justify-content-between align-items-center">
      <h1 class="text-lg-start text-center">Kosár</h1>
      <button routerLink="/orderPage/transportDetails">
        Folytatás
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      @for (
        cartProduct of cartService.usersCart.cartProductList;
        track $index
      ) {
        <app-basket-card
          [cartProduct]="cartProduct"
          (changeAmount)="changeAmount($event, $index)"
        />
      }
    </div>
  </div>
</div>
