<div class="container-fluid my-4 cardContainer py-3">
  <div class="row">
    <div class="col-lg-12 d-flex justify-content-end align-items-center">
      <button (click)="deleteProductFromBasket()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-4">
    </div>
    <div class="col-lg-8">
      <div class="container-fluid d-flex flex-column">
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-between">
            <h4>{{cartProduct().cartProduct.name}}</h4>
            <p class="m-0">{{cartProduct().cartProduct.price}} Ft</p>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 mb-3 d-flex justify-content-lg-start justify-content-center align-items-center">
            <button (click)="changeAmountOfProduct(-1)">
              <span class="material-symbols-outlined">remove</span>
            </button>
            <span class="mx-2">{{cartProduct().amount}}</span>
            <button (click)="changeAmountOfProduct(1)">
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
