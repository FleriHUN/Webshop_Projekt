<div class="container-fluid d-flex justify-content-center align-items-center">
  <div class="row w-100">
    <div class="col-lg-12 d-flex justify-content-between align-items-center">
      <div class="d-flex justify-content-start align-items-center" routerLink="/homePage" style="cursor: pointer;">
        <img src="/assets/icon.png">
        <span id="title">FormaLux</span>
      </div>
      <div class="d-flex">
        <button class="mx-3" (click)="userIconNavigation()">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
        <button routerLink="/orderPage/basket">
          <span class="material-symbols-outlined">shopping_cart</span>
        </button>

        @if (userService.loggedUser?.role?.name == "ROLE_admin") {
          <button>
            <span class="material-symbols-outlined">build</span>
          </button>
        }
      </div>
    </div>
  </div>
</div>
