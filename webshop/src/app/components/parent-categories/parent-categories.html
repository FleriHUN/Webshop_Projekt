<div class="container-fluid mb-4">
  <div class="row">
    <div class="col-lg-12 d-flex flex-lg-row flex-column justify-content-center align-items-center">
      @for (category of parentCategories; track $index) {
        <button (click)="selectCategory(category.id)" class="mx-2">{{category.name}}</button>
      }
    </div>
  </div>
</div>
