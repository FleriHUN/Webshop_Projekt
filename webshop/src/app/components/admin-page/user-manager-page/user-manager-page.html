<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <h1 class="text-center">Felhasználó kezelése</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      @for (user of users; track $index) {
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-10">
              <ul>
                <li><span class="fw-bold">Felhasználónév: </span> {{user.username}} </li>
                <li><span class="fw-bold">E-mail cim: </span> {{user.email}}</li>
                <li><span class="fw-bold">Telefonszam: </span> {{user.phone}}</li>
              </ul>
            </div>

            <div class="col-lg-2">
              <button (click)="deleteUser(user.id!)">Felhasználó törlése</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
