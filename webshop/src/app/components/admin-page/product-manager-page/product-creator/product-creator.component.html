<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">
      <div id="secondContainer" class="container-fluid d-flex flex-column justify-content-between py-3">
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-between align-items-center">
            <h3 class="text-center w-100">Termék létrehozása</h3>
            <button (click)="closePopup()">X</button>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <form [formGroup]="form" class="container-fluid h-100">
              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="name">Termék neve:</label>
                  <input class="form-control" placeholder="Termék neve" type="text" id="name" formControlName="name">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="description">Leirás:</label>
                  <textarea class="form-control" placeholder="Termék Leirása" type="text" id="description" formControlName="description"> </textarea>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-3">
                  <label for="heightInCm">Magasság</label>
                  <input type="number" class="form-control" placeholder="Magasság" id="heightInCm" formControlName="heightInCm">
                </div>
                <div class="col-lg-3">
                  <label for="widthInCm">Széllesség</label>
                  <input type="number" class="form-control" placeholder="Széllesség" id="widthInCm" formControlName="widthInCm">
                </div>
                <div class="col-lg-3">
                  <label for="depthInCm">Mélysés</label>
                  <input type="number" class="form-control" placeholder="Hosszuság" id="depthInCm" formControlName="depthInCm">
                </div>
                <div class="col-lg-3">
                  <label for="weightInKg">Súly</label>
                  <input type="number" class="form-control" placeholder="Súly" id="weightInKg" formControlName="weightInKg">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="price">Ár:</label>
                  <input class="form-control" placeholder="Termék ára" type="text" id="price" formControlName="price">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="amount">Raktáron lévő mennyiség:</label>
                  <input class="form-control" placeholder="Raktáron lévő mennyiség" type="number" id="amount" formControlName="amount">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="category">Kategória:</label>
                  <select class="form-select" name="category" id="category" formControlName="category">
                    <option value="">Termék kategóriája</option>
                    @for (category of categories; track $index) {
                      <option [value]="$index">{{category.name}}</option>
                    }
                  </select>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-lg-12">
                  <label for="brand">Márka:</label>
                  <select class="form-select" name="brand" id="brand" formControlName="brand">
                    <option value="">Termék márkája</option>
                    @for (brand of brands; track $index) {
                      <option [value]="$index">{{brand.name}}</option>
                    }
                  </select>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <label for="image">Fénykép feltöltése</label>
                  <div class="input-group mb-3">
                    <input type="file" class="form-control" id="image">
                  </div>
                </div>
              </div>

            </form>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-center align-items-center">
            <button [disabled]="form.invalid" (click)="addProduct()">Mentés</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
