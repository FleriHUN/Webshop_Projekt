<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 d-flex flex-column justify-content-center align-items-center">
      <h1>Termékek kezelése</h1>
      <button (click)="showCreator = true">Termék hozzáadása</button>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      @for (product of products; track $index) {
        <app-admin-product-card [product]="product" (delete)="deleteProduct($event, $index)" />
      }
    </div>
  </div>
</div>

@if (showCreator) {
  <app-product-creator (close)="showCreator = false" (createProduct)="addProduct($event)"/>
}
