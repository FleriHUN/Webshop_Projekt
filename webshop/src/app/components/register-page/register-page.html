<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <div id="formContainer" class="py-4">
        <form class="container-fluid" [formGroup]="registerForm">
          <div class="row">
            <div class="col-lg-12">
              <label for="username">Felhasználó név:</label>
              <input type="text" id="username" placeholder="Felhasználónév" class="form-control" formControlName="username">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label for="email">E-mail</label>
              <input type="text" id="email" placeholder="E-mail" class="form-control" formControlName="email">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label for="phone">Telefonszám</label>
              <input type="text" id="phone" placeholder="Telefonszám" class="form-control" formControlName="phone">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label for="password">Jelszó</label>
              <input type="text" id="password" placeholder="Jelszó" class="form-control" formControlName="password">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label for="passwordAgain">Jelszó megerősitése</label>
              <input type="text" id="passwordAgain" placeholder="Jelszó újra" class="form-control" formControlName="passwordAgain">
            </div>
          </div>
        </form>
        <div class="d-flex flex-column justify-content-center align-items-center">
          <button [disabled]="registerForm.invalid">Regisztrációs</button>
          <button>Már van fiókom</button>
        </div>
      </div>
    </div>
  </div>
</div>
