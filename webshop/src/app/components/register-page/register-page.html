<div class="container-fluid" style="height: 100vh;">
  <div class="row">
    <div class="col-lg-12 d-flex justify-content-center">
      <div id="formContainer" class="d-flex flex-column justify-content-between py-4">
        <form class="container-fluid px-4" [formGroup]="registerForm">
          <div class="row">
            <div class="col-lg-12">
              <h2 class="text-center">Regisztráció</h2>
            </div>
          </div>

          <div class="row">
            <div class="col-lg-12">
              <label class="fw-bold w-100 text-lg-start text-center" for="username">Felhasználó név:</label>
              <input type="text" id="username" placeholder="Felhasználónév" class="form-control" formControlName="username">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label class="fw-bold w-100 text-lg-start text-center" for="email">E-mail</label>
              <input type="text" id="email" placeholder="E-mail" class="form-control" formControlName="email">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label class="fw-bold w-100 text-lg-start text-center" for="phone">Telefonszám</label>
              <input type="text" id="phone" placeholder="Telefonszám" class="form-control" formControlName="phone">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label class="fw-bold w-100 text-lg-start text-center" for="password">Jelszó</label>
              <input type="password" id="password" placeholder="Jelszó" class="form-control" formControlName="password">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-12">
              <label class="fw-bold w-100 text-lg-start text-center" for="passwordAgain">Jelszó megerősitése</label>
              <input type="password" id="passwordAgain" placeholder="Jelszó újra" class="form-control" formControlName="passwordAgain">
            </div>
          </div>
        </form>
        <div class="d-flex flex-column justify-content-center align-items-center">
          <button [disabled]="registerForm.invalid">Regisztráció</button>
          <a routerLink="/login" class="text-decoration-none">Már van fiókom</a>
        </div>
      </div>
    </div>
  </div>
</div>
