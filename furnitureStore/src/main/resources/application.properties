spring.application.name=furnitureStore
spring.datasource.url=jdbc:mysql://localhost:3306/furniture_store
spring.datasource.username=root
spring.datasource.password=root

spring.security.user.name = username
spring.security.user.password = password

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

# A statikus eroforrasokat mostantol a WebMvcConfig.java kezeli
# (regen: spring.web.resources.static-locations=file:./productImg)

# ============================================================
# Gmail SMTP - Jelszo visszaallitas e-mailekhez
# ============================================================
# FONTOS: a spring.mail.password NEM a sima Gmail jelszavad,
# hanem egy 16 karakteres "App Password"!
# Hogy hogyan kell ilyet csinalni:
#   1. Kapcsold be a 2FA-t a Google fiokodon
#      https://myaccount.google.com/security
#   2. Menj ide: https://myaccount.google.com/apppasswords
#   3. Hozz letre egy uj App Password-ot (pl. "FormaLux backend" nevvel)
#   4. A 16 karakteres kodot szokozok NELKUL masold be ide lentre
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=formalux67@gmail.com
spring.mail.password=YOUR_16_CHAR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
